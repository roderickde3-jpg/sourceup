<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products | SourceUp</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --forest: #174A32;
      --green: #2F7D4E;
      --green-hover: #25643E;
      --lime: #B9D86B;
      --cream: #F7F5EC;
      --soft-green: #EDF4E8;
      --white: #FFFFFF;
      --ink: #17231C;
      --muted: #647168;
      --border: #DDE5DD;
      --danger: #B42318;
      --shadow: 0 18px 45px rgba(23,74,50,.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #FAFCF9;
      color: var(--ink);
    }

    h1, h2, h3 {
      font-family: "Manrope", sans-serif;
    }

    button, input {
      font: inherit;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */

    header {
      height: 82px;
      padding: 0 6%;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      height: 46px;
      max-width: 180px;
      object-fit: contain;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .home-link {
      font-size: 14px;
      font-weight: 700;
      color: var(--forest);
    }

    .cart-button {
      border: 0;
      background: var(--forest);
      color: white;
      padding: 11px 17px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .cart-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--lime);
      color: var(--forest);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin-left: 7px;
      font-size: 11px;
      font-weight: 800;
    }

    /* PAGE HEADER */

    .page-header {
      padding: 65px 6% 35px;
      max-width: 1300px;
      margin: auto;
    }

    .eyebrow {
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      margin-bottom: 8px;
    }

    .page-header h1 {
      font-size: clamp(38px, 5vw, 58px);
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    .page-header p {
      color: var(--muted);
      max-width: 650px;
      line-height: 1.6;
    }

    /* FILTER */

    .toolbar {
      max-width: 1300px;
      margin: auto;
      padding: 0 6% 30px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search {
      flex: 1;
      min-width: 240px;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 16px;
      outline: none;
      background: white;
    }

    .search:focus {
      border-color: var(--green);
    }

    .filter {
      border: 1px solid var(--border);
      background: white;
      padding: 0 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      color: var(--forest);
    }

    /* PRODUCTS */

    .products {
      max-width: 1300px;
      margin: auto;
      padding: 0 6% 90px;
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 20px;
    }

    .product {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: .2s;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .product-image {
      height: 180px;
      background: var(--soft-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
    }

    .product-info {
      padding: 20px;
    }

    .category {
      color: var(--green);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .product h3 {
      font-size: 19px;
      margin-bottom: 3px;
    }

    .unit {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 17px;
    }

    .price {
      font-size: 21px;
      font-weight: 800;
      color: var(--forest);
      margin-bottom: 15px;
    }

    .price span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .quantity-row {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 8px;
    }

    .quantity {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      outline: none;
    }

    .add {
      border: 0;
      background: var(--green);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .add:hover {
      background: var(--green-hover);
    }

    /* CART OVERLAY */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      opacity: 0;
      visibility: hidden;
      transition: .2s;
      z-index: 199;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* CART */

    .cart {
      position: fixed;
      top: 0;
      right: -430px;
      width: min(430px,100%);
      height: 100vh;
      background: white;
      z-index: 200;
      box-shadow: -20px 0 50px rgba(0,0,0,.12);
      transition: .3s;
      display: flex;
      flex-direction: column;
    }

    .cart.open {
      right: 0;
    }

    .cart-header {
      padding: 23px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h2 {
      font-size: 22px;
    }

    .close {
      border: 0;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 70px 20px;
    }

    .cart-item {
      border-bottom: 1px solid var(--border);
      padding: 15px 0;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .cart-item-name {
      font-weight: 700;
    }

    .cart-item-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .remove {
      border: 0;
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      font-size: 12px;
      margin-top: 5px;
    }

    .cart-price {
      font-weight: 800;
      white-space: nowrap;
    }

    .cart-footer {
      border-top: 1px solid var(--border);
      padding: 22px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .total {
      font-size: 24px;
      font-weight: 800;
      color: var(--forest);
    }

    .checkout {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 9px;
      background: var(--green);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .checkout:hover {
      background: var(--green-hover);
    }

    .note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 12px;
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translate(-50%,30px);
      background: var(--forest);
      color: white;
      padding: 12px 18px;
      border-radius: 9px;
      opacity: 0;
      visibility: hidden;
      transition: .2s;
      z-index: 500;
      font-size: 13px;
      font-weight: 700;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%,0);
    }

    @media(max-width:1000px) {
      .products {
        grid-template-columns: repeat(2,1fr);
      }
    }

    @media(max-width:600px) {
      header {
        padding: 0 5%;
      }

      .logo {
        height: 39px;
        max-width: 140px;
      }

      .home-link {
        display: none;
      }

      .page-header,
      .toolbar,
      .products {
        padding-left: 5%;
        padding-right: 5%;
      }

      .products {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html">
    <img src="logo.png" class="logo" alt="SourceUp">
  </a>

  <div class="header-right">
    <a href="index.html" class="home-link">Home</a>

    <button class="cart-button" onclick="openCart()">
      Cart
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>

</header>


<section class="page-header">

  <div class="eyebrow">SourceUp Marketplace</div>

  <h1>Fresh products.<br>Ready to source.</h1>

  <p>
    Select the products and quantities your business needs.
    Prices below are sample prices while we build the live pricing system.
  </p>

</section>


<div class="toolbar">

  <input
    id="search"
    class="search"
    type="text"
    placeholder="Search products..."
    oninput="renderProducts()"
  >

  <button class="filter" onclick="setCategory('All')">All</button>
  <button class="filter" onclick="setCategory('Vegetables')">Vegetables</button>
  <button class="filter" onclick="setCategory('Essentials')">Essentials</button>

</div>


<section class="products" id="products"></section>


<div class="overlay" id="overlay" onclick="closeCart()"></div>


<aside class="cart" id="cart">

  <div class="cart-header">
    <h2>Your Cart</h2>
    <button class="close" onclick="closeCart()">×</button>
  </div>

  <div class="cart-items" id="cartItems"></div>

  <div class="cart-footer">

    <div class="total-row">
      <strong>Total</strong>
      <div class="total" id="cartTotal">₱0.00</div>
    </div>

    <button class="checkout" onclick="checkout()">
      Continue to Checkout
    </button>

    <div class="note">
      Final price and availability are subject to confirmation.
    </div>

  </div>

</aside>


<div class="toast" id="toast"></div>


<script>

  const products = [
    {
      id: 1,
      name: "Tomato",
      category: "Vegetables",
      unit: "kg",
      price: 80,
      icon: "🍅"
    },
    {
      id: 2,
      name: "Red Onion",
      category: "Essentials",
      unit: "kg",
      price: 120,
      icon: "🧅"
    },
    {
      id: 3,
      name: "Carrot",
      category: "Vegetables",
      unit: "kg",
      price: 100,
      icon: "🥕"
    },
    {
      id: 4,
      name: "Pechay",
      category: "Vegetables",
      unit: "kg",
      price: 70,
      icon: "🥬"
    },
    {
      id: 5,
      name: "Potato",
      category: "Vegetables",
      unit: "kg",
      price: 95,
      icon: "🥔"
    },
    {
      id: 6,
      name: "Garlic",
      category: "Essentials",
      unit: "kg",
      price: 180,
      icon: "🧄"
    },
    {
      id: 7,
      name: "Eggplant",
      category: "Vegetables",
      unit: "kg",
      price: 90,
      icon: "🍆"
    },
    {
      id: 8,
      name: "Cabbage",
      category: "Vegetables",
      unit: "kg",
      price: 85,
      icon: "🥬"
    }
  ];


  let cart = JSON.parse(localStorage.getItem("sourceupCart")) || [];

  let activeCategory = "All";


  function money(value) {
    return "₱" + value.toLocaleString("en-PH", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }


  function renderProducts() {

    const container = document.getElementById("products");

    const query =
      document.getElementById("search").value.toLowerCase();


    const filtered = products.filter(product => {

      const matchesSearch =
        product.name.toLowerCase().includes(query);

      const matchesCategory =
        activeCategory === "All" ||
        product.category === activeCategory;

      return matchesSearch && matchesCategory;

    });


    if (!filtered.length) {

      container.innerHTML =
        '<p style="color:#647168;">No products found.</p>';

      return;

    }


    container.innerHTML = filtered.map(product => `

      <article class="product">

        <div class="product-image">
          ${product.icon}
        </div>

        <div class="product-info">

          <div class="category">
            ${product.category}
          </div>

          <h3>
            ${product.name}
          </h3>

          <div class="unit">
            Sold per ${product.unit}
          </div>

          <div class="price">
            ${money(product.price)}
            <span>/ ${product.unit}</span>
          </div>

          <div class="quantity-row">

            <input
              id="qty-${product.id}"
              class="quantity"
              type="number"
              value="1"
              min="0.5"
              step="0.5"
            >

            <button
              class="add"
              onclick="addToCart(${product.id})"
            >
              Add
            </button>

          </div>

        </div>

      </article>

    `).join("");

  }


  function setCategory(category) {

    activeCategory = category;

    renderProducts();

  }


  function addToCart(id) {

    const product =
      products.find(item => item.id === id);


    const quantity =
      Number(
        document.getElementById(`qty-${id}`).value
      );


    if (!quantity || quantity <= 0) {
      showToast("Please enter a valid quantity.");
      return;
    }


    const existing =
      cart.find(item => item.id === id);


    if (existing) {

      existing.quantity += quantity;

    } else {

      cart.push({
        ...product,
        quantity
      });

    }


    saveCart();

    showToast(
      `${product.name} added to cart`
    );

  }


  function saveCart() {

    localStorage.setItem(
      "sourceupCart",
      JSON.stringify(cart)
    );

    updateCart();

  }


  function updateCart() {

    const count =
      cart.reduce(
        (sum,item) => sum + item.quantity,
        0
      );


    document.getElementById("cartCount").textContent =
      count;


    const container =
      document.getElementById("cartItems");


    if (!cart.length) {

      container.innerHTML =
        '<div class="empty">Your cart is empty.</div>';

      document.getElementById("cartTotal").textContent =
        money(0);

      return;

    }


    container.innerHTML = cart.map(item => `

      <div class="cart-item">

        <div>

          <div class="cart-item-name">
            ${item.name}
          </div>

          <div class="cart-item-meta">
            ${item.quantity} ${item.unit}
            ×
            ${money(item.price)}
          </div>

          <button
            class="remove"
            onclick="removeItem(${item.id})"
          >
            Remove
          </button>

        </div>

        <div class="cart-price">
          ${money(item.price * item.quantity)}
        </div>

      </div>

    `).join("");


    const total =
      cart.reduce(
        (sum,item) =>
          sum + item.price * item.quantity,
        0
      );


    document.getElementById("cartTotal").textContent =
      money(total);

  }


  function removeItem(id) {

    cart =
      cart.filter(item => item.id !== id);

    saveCart();

  }


  function openCart() {

    document
      .getElementById("cart")
      .classList.add("open");

    document
      .getElementById("overlay")
      .classList.add("show");

  }


  function closeCart() {

    document
      .getElementById("cart")
      .classList.remove("open");

    document
      .getElementById("overlay")
      .classList.remove("show");

  }


  function checkout() {

  if (!cart.length) {

    showToast("Your cart is empty.");

    return;

  }

  window.location.href = "checkout.html";

}


  let toastTimer;


  function showToast(message) {

    const toast =
      document.getElementById("toast");


    toast.textContent = message;

    toast.classList.add("show");


    clearTimeout(toastTimer);


    toastTimer = setTimeout(() => {

      toast.classList.remove("show");

    }, 2200);

  }


  renderProducts();

  updateCart();

</script>

</body>
</html>
