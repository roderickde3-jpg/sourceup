<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | SourceUp</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --forest:#174A32;
      --green:#2F7D4E;
      --green-dark:#25643E;
      --cream:#F7F5EC;
      --white:#FFFFFF;
      --ink:#17231C;
      --muted:#69756D;
      --border:#DDE5DD;
      --danger:#B42318;
      --danger-bg:#FDECEC;
      --success:#216A3C;
      --success-bg:#E9F6EC;
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body {
      font-family:"DM Sans",sans-serif;
      background:var(--cream);
      color:var(--ink);
    }

    button,
    input {
      font:inherit;
    }

    .page {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;

      background:
        radial-gradient(circle at 85% 15%, rgba(185,216,107,.25), transparent 30%),
        radial-gradient(circle at 10% 90%, rgba(47,125,78,.10), transparent 28%),
        var(--cream);
    }

    .card {
      width:100%;
      max-width:430px;
      background:white;
      border:1px solid var(--border);
      border-radius:22px;
      padding:38px;
      box-shadow:0 25px 70px rgba(23,74,50,.10);
    }

    .brand {
      text-align:center;
      margin-bottom:30px;
    }

    .brand img {
      display:block;
      height:82px;
      max-width:210px;
      width:auto;
      object-fit:contain;
      margin:0 auto 17px;
    }

    .brand h1 {
      font-family:"Manrope",sans-serif;
      color:var(--forest);
      font-size:27px;
      margin-bottom:8px;
    }

    .brand p {
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
      max-width:310px;
      margin:auto;
    }

    .field {
      margin-bottom:17px;
    }

    .field label {
      display:block;
      margin-bottom:7px;
      font-size:12px;
      font-weight:700;
    }

    .password-wrap {
      position:relative;
    }

    .field input {
      width:100%;
      height:50px;
      padding:0 72px 0 14px;
      border:1px solid var(--border);
      border-radius:10px;
      outline:none;
      background:white;
    }

    .field input:focus {
      border-color:var(--green);
      box-shadow:0 0 0 3px rgba(47,125,78,.08);
    }

    .show-btn {
      position:absolute;
      right:13px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      color:var(--green);
      font-size:11px;
      font-weight:800;
      cursor:pointer;
    }

    .update-btn {
      width:100%;
      height:50px;
      border:0;
      border-radius:10px;
      background:var(--green);
      color:white;
      font-weight:800;
      cursor:pointer;
      margin-top:3px;
    }

    .update-btn:hover {
      background:var(--green-dark);
    }

    .update-btn:disabled {
      opacity:.6;
      cursor:not-allowed;
    }

    .message {
      display:none;
      margin-top:16px;
      padding:12px 14px;
      border-radius:10px;
      font-size:12px;
      line-height:1.5;
    }

    .message.error {
      display:block;
      background:var(--danger-bg);
      color:var(--danger);
    }

    .message.success {
      display:block;
      background:var(--success-bg);
      color:var(--success);
    }

    .back {
      display:block;
      text-align:center;
      margin-top:22px;
      color:var(--green);
      text-decoration:none;
      font-size:12px;
      font-weight:700;
    }

    @media(max-width:520px) {
      .page {
        padding:14px;
      }

      .card {
        padding:32px 23px;
      }

      .brand img {
        height:72px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="card">

    <div class="brand">

      <img src="logo.png" alt="SourceUp">

      <h1>Reset Password</h1>

      <p>
        Create a new password for your SourceUp administrator account.
      </p>

    </div>

    <form id="resetForm">

      <div class="field">

        <label for="newPassword">
          New Password
        </label>

        <div class="password-wrap">

          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Enter new password"
            minlength="8"
            required>

          <button
            class="show-btn"
            type="button"
            data-target="newPassword">
            SHOW
          </button>

        </div>

      </div>


      <div class="field">

        <label for="confirmPassword">
          Confirm New Password
        </label>

        <div class="password-wrap">

          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Confirm new password"
            minlength="8"
            required>

          <button
            class="show-btn"
            type="button"
            data-target="confirmPassword">
            SHOW
          </button>

        </div>

      </div>


      <button
        id="updateButton"
        class="update-btn"
        type="submit">
        Update Password
      </button>


      <div
        id="message"
        class="message">
      </div>

    </form>


    <a
      class="back"
      href="admin.html">
      ← Back to Admin Login
    </a>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://wzpjeplgvgwwgoewfsum.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_tRwJJVSxCKXz4hG11_rIww__LtxcKEg";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const form =
    document.getElementById("resetForm");

  const message =
    document.getElementById("message");

  const updateButton =
    document.getElementById("updateButton");


  /* SHOW / HIDE PASSWORD */

  document
    .querySelectorAll(".show-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const input =
            document.getElementById(
              this.dataset.target
            );

          if (input.type === "password") {

            input.type = "text";
            this.textContent = "HIDE";

          } else {

            input.type = "password";
            this.textContent = "SHOW";

          }

        }
      );

    });


  /* UPDATE PASSWORD */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();


      const newPassword =
        document
          .getElementById("newPassword")
          .value;

      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      if (newPassword.length < 8) {

        showError(
          "Password must contain at least 8 characters."
        );

        return;

      }


      if (newPassword !== confirmPassword) {

        showError(
          "Passwords do not match."
        );

        return;

      }


      updateButton.disabled = true;
      updateButton.textContent =
        "Updating Password...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .updateUser({
              password:newPassword
            });


        if (error) {
          throw error;
        }


        showSuccess(
          "Password updated successfully. Redirecting to Admin Login..."
        );


        setTimeout(
          async function() {

            await supabaseClient
              .auth
              .signOut();

            window.location.href =
              "admin.html";

          },
          1800
        );


      } catch(error) {

        console.error(
          "PASSWORD RESET ERROR:",
          error
        );

        showError(
          "RESET ERROR: " +
          error.message
        );

        updateButton.disabled = false;

        updateButton.textContent =
          "Update Password";

      }

    }
  );


  function showError(text) {

    message.className =
      "message error";

    message.textContent =
      text;

  }


  function showSuccess(text) {

    message.className =
      "message success";

    message.textContent =
      text;

  }


  function clearMessage() {

    message.className =
      "message";

    message.textContent = "";

  }

</script>

</body>
</html>
