<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SourceUp Admin</title>
  <link rel="icon" href="favicon.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #0d4f3c;
      --green2: #2f8555;
      --green3: #eaf5ef;
      --lime: #54b92c;
      --cream: #f7f8f2;
      --white: #ffffff;
      --text: #17352c;
      --muted: #718078;
      --border: #dfe7e2;
      --danger: #c9362b;
      --danger-bg: #fff0ee;
      --shadow: 0 8px 30px rgba(13,79,60,.08);
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .login-card {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 24px;
      padding: 42px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-logo img {
      width: 145px;
      max-height: 90px;
      object-fit: contain;
    }

    .login-card h1 {
      text-align: center;
      color: var(--green);
      font-size: 34px;
      margin-bottom: 10px;
    }

    .login-card .subtitle {
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 32px;
    }

    /* DASHBOARD */

    #dashboard {
      min-height: 100vh;
    }

    .topbar {
      height: 76px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand img {
      width: 115px;
      max-height: 55px;
      object-fit: contain;
    }

    .admin-label {
      background: var(--green3);
      color: var(--green);
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-name {
      color: var(--muted);
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: calc(100vh - 76px);
    }

    .sidebar {
      background: var(--green);
      padding: 25px 15px;
    }

    .nav-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: rgba(255,255,255,.78);
      padding: 14px 16px;
      text-align: left;
      border-radius: 10px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255,255,255,.13);
      color: white;
    }

    .main {
      padding: 32px;
      width: 100%;
      max-width: 1500px;
      margin: auto;
    }

    .page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .page-heading h1 {
      color: var(--green);
      font-size: 30px;
      margin-bottom: 6px;
    }

    .page-heading p {
      color: var(--muted);
    }

    /* BUTTONS */

    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: bold;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--green2);
      color: white;
    }

    .btn-dark {
      background: var(--green);
      color: white;
    }

    .btn-light {
      background: white;
      color: var(--green);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #ffd5d0;
    }

    .btn-small {
      padding: 8px 11px;
      font-size: 12px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,.03);
    }

    .stat-title {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .stat-value {
      color: var(--green);
      font-size: 30px;
      font-weight: bold;
    }

    /* PANEL */

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.03);
      overflow: hidden;
    }

    .panel-head {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .panel-head h2 {
      font-size: 18px;
      color: var(--green);
    }

    .search {
      width: 280px;
      max-width: 100%;
    }

    /* FORM */

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
      color: var(--text);
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfdad4;
      border-radius: 10px;
      padding: 12px 13px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--green2);
      box-shadow: 0 0 0 3px rgba(47,133,85,.10);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .field {
      margin-bottom: 18px;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: var(--green2);
      font-weight: bold;
      font-size: 12px;
    }

    .forgot {
      float: right;
      color: var(--green2);
      text-decoration: none;
      font-size: 12px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      display: none;
    }

    .message.error {
      display: block;
      color: #b42318;
      background: #fff0ee;
    }

    .message.success {
      display: block;
      color: #176b42;
      background: #eaf8ef;
    }

    /* PRODUCTS */

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      background: #f8faf8;
      color: #627169;
      text-align: left;
      font-size: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #edf1ee;
      vertical-align: middle;
      font-size: 14px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .product-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .product-image {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      object-fit: cover;
      background: #eef2ef;
      border: 1px solid var(--border);
    }

    .product-name {
      font-weight: bold;
      color: var(--text);
    }

    .product-category {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-green {
      color: #176b42;
      background: #e6f7ed;
    }

    .badge-red {
      color: #a82820;
      background: #ffefed;
    }

    .badge-gray {
      color: #59635e;
      background: #edf0ee;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(4,31,23,.60);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      width: 100%;
      max-width: 760px;
      max-height: 92vh;
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .modal-head {
      padding: 22px 25px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-head h2 {
      color: var(--green);
    }

    .close {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: none;
      background: #f1f4f2;
      font-size: 18px;
    }

    .modal-body {
      padding: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 18px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .image-preview {
      width: 130px;
      height: 130px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #f4f6f4;
      margin-top: 10px;
      display: none;
    }

    .check-row {
      display: flex;
      gap: 25px;
      margin: 8px 0 22px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .check-item input {
      width: auto;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    .loading {
      opacity: .65;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: flex;
        padding: 10px;
        overflow-x: auto;
      }

      .nav-btn {
        width: auto;
        white-space: nowrap;
        margin: 0 5px 0 0;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .main {
        padding: 20px;
      }
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 0 15px;
      }

      .brand img {
        width: 90px;
      }

      .admin-name,
      .admin-label {
        display: none;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 16px;
      }

      .stat-value {
        font-size: 24px;
      }

      .page-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .page-heading .btn {
        width: 100%;
      }

      .panel-head {
        flex-direction: column;
        align-items: stretch;
      }

      .search {
        width: 100%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .login-card {
        padding: 30px 22px;
      }

      .login-card h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage">
  <div class="login-card">

    <div class="login-logo">
      <img src="logo.png" alt="SourceUp">
    </div>

    <h1>Admin Portal</h1>

    <p class="subtitle">
      Manage SourceUp products, pricing, inventory and availability.
    </p>

    <form id="loginForm">

      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" required autocomplete="email">
      </div>

      <div class="field">
        <label>
          Password
          <a href="#" id="forgotPassword" class="forgot">Forgot Password?</a>
        </label>

        <div class="password-wrap">
          <input
            id="loginPassword"
            type="password"
            required
            autocomplete="current-password"
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            SHOW
          </button>
        </div>
      </div>

      <button class="btn btn-primary" style="width:100%;" type="submit">
        Sign In
      </button>

      <div id="loginMessage" class="message"></div>
    </form>

    <p style="text-align:center;color:#8a9690;font-size:12px;margin-top:28px;">
      Authorized SourceUp administrators only
    </p>

  </div>
</section>


<!-- DASHBOARD -->
<section id="dashboard" class="hidden">

  <header class="topbar">

    <div class="brand">
      <img src="logo.png" alt="SourceUp">
      <span class="admin-label">ADMIN</span>
    </div>

    <div class="top-actions">
      <span id="adminName" class="admin-name"></span>

      <button
        id="logoutBtn"
        class="btn btn-light btn-small"
      >
        Log Out
      </button>
    </div>

  </header>

  <div class="layout">

    <aside class="sidebar">
      <button class="nav-btn active">Products</button>
    </aside>

    <main class="main">

      <div class="page-heading">

        <div>
          <h1>Product Management</h1>
          <p>Manage products, prices, stock and availability.</p>
        </div>

        <button
          id="addProductBtn"
          class="btn btn-primary"
        >
          + Add Product
        </button>

      </div>


      <div class="stats">

        <div class="stat-card">
          <div class="stat-title">TOTAL PRODUCTS</div>
          <div class="stat-value" id="totalProducts">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-title">AVAILABLE</div>
          <div class="stat-value" id="availableProducts">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-title">OUT / UNAVAILABLE</div>
          <div class="stat-value" id="unavailableProducts">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-title">HIDDEN</div>
          <div class="stat-value" id="hiddenProducts">0</div>
        </div>

      </div>


      <div class="panel">

        <div class="panel-head">

          <h2>Products</h2>

          <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="Search product..."
          >

        </div>

        <div id="productsContainer">
          <div class="empty">Loading products...</div>
        </div>

      </div>

    </main>

  </div>
</section>


<!-- PRODUCT MODAL -->
<div id="productModal" class="modal hidden">

  <div class="modal-card">

    <div class="modal-head">
      <h2 id="modalTitle">Add Product</h2>
      <button id="closeModal" class="close">×</button>
    </div>

    <form id="productForm">

      <div class="modal-body">

        <input type="hidden" id="productId">
        <input type="hidden" id="existingImageUrl">

        <div class="form-grid">

          <div class="field">
            <label>Product Name *</label>
            <input id="productName" required>
          </div>

          <div class="field">
            <label>Category</label>
            <input
              id="productCategory"
              placeholder="e.g. Vegetables"
            >
          </div>

          <div class="field">
            <label>Unit *</label>

            <select id="productUnit" required>
              <option value="">Select unit</option>
              <option value="kg">Kilogram (kg)</option>
              <option value="pc">Piece (pc)</option>
              <option value="bundle">Bundle</option>
              <option value="pack">Pack</option>
              <option value="tray">Tray</option>
              <option value="sack">Sack</option>
              <option value="box">Box</option>
              <option value="crate">Crate</option>
            </select>
          </div>

          <div class="field">
            <label>Selling Price (₱) *</label>
            <input
              id="productPrice"
              type="number"
              min="0"
              step="0.01"
              required
            >
          </div>

          <div class="field">
            <label>Stock</label>
            <input
              id="productStock"
              type="number"
              min="0"
              step="0.01"
              value="0"
            >
          </div>

          <div class="field">
            <label>Product Image</label>

            <input
              id="productImage"
              type="file"
              accept="image/jpeg,image/png,image/webp"
            >

            <img
              id="imagePreview"
              class="image-preview"
              alt="Preview"
            >
          </div>

          <div class="field full">
            <label>Description</label>

            <textarea
              id="productDescription"
              placeholder="Optional product description..."
            ></textarea>
          </div>

          <div class="full check-row">

            <label class="check-item">
              <input
                id="productAvailable"
                type="checkbox"
                checked
              >
              Available
            </label>

            <label class="check-item">
              <input
                id="productActive"
                type="checkbox"
                checked
              >
              Active / Visible
            </label>

          </div>

        </div>

        <div id="productMessage" class="message"></div>

        <div class="modal-actions">

          <button
            type="button"
            id="cancelProduct"
            class="btn btn-light"
          >
            Cancel
          </button>

          <button
            type="submit"
            id="saveProductBtn"
            class="btn btn-primary"
          >
            Save Product
          </button>

        </div>

      </div>

    </form>

  </div>
</div>


<script>
const SUPABASE_URL =
  "https://wzpjeplgvgwwgoewfsum.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_tRwJJVSxCKXz4hG11_rIww__LtxcKEg";

const BUCKET = "product-images";

const RESET_URL =
  "https://roderickde3-jpg.github.io/sourceup/reset-password.html";

const supabaseClient =
  window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


let products = [];
let currentProfile = null;


/* ELEMENTS */

const loginPage = document.getElementById("loginPage");
const dashboard = document.getElementById("dashboard");

const loginForm = document.getElementById("loginForm");
const loginEmail = document.getElementById("loginEmail");
const loginPassword = document.getElementById("loginPassword");
const loginMessage = document.getElementById("loginMessage");

const productModal = document.getElementById("productModal");
const productForm = document.getElementById("productForm");
const productMessage = document.getElementById("productMessage");

const productsContainer =
  document.getElementById("productsContainer");


/* HELPERS */

function showMessage(element, text, type = "error") {
  element.textContent = text;
  element.className = "message " + type;
}

function clearMessage(element) {
  element.textContent = "";
  element.className = "message";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatMoney(value) {
  return Number(value || 0).toLocaleString(
    "en-PH",
    {
      style: "currency",
      currency: "PHP"
    }
  );
}


/* ADMIN CHECK */

async function getAdminProfile(userId) {

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id, full_name, role, is_active")
    .eq("id", userId)
    .maybeSingle();

  if (error) {
    throw new Error(
      "PROFILE ERROR: " + error.message
    );
  }

  if (!data) {
    throw new Error("Admin profile not found.");
  }

  const role = String(data.role || "")
    .trim()
    .replace(/^['"]|['"]$/g, "");

  if (role !== "admin") {
    throw new Error(
      "This account is not authorized as an administrator."
    );
  }

  if (data.is_active !== true) {
    throw new Error(
      "This administrator account is inactive."
    );
  }

  return data;
}


/* LOGIN */

loginForm.addEventListener("submit", async (e) => {

  e.preventDefault();

  clearMessage(loginMessage);

  const button =
    loginForm.querySelector('button[type="submit"]');

  button.disabled = true;
  button.textContent = "Signing in...";

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: loginEmail.value.trim(),
        password: loginPassword.value
      });

    if (error) {
      throw new Error(
        "AUTH ERROR: " + error.message
      );
    }

    currentProfile =
      await getAdminProfile(data.user.id);

    openDashboard();

  } catch (error) {

    await supabaseClient.auth.signOut();

    showMessage(
      loginMessage,
      error.message,
      "error"
    );

  } finally {

    button.disabled = false;
    button.textContent = "Sign In";

  }
});


/* PASSWORD SHOW */

document
  .getElementById("showPassword")
  .addEventListener("click", () => {

    const visible =
      loginPassword.type === "text";

    loginPassword.type =
      visible ? "password" : "text";

    document.getElementById("showPassword")
      .textContent =
      visible ? "SHOW" : "HIDE";
  });


/* FORGOT PASSWORD */

document
  .getElementById("forgotPassword")
  .addEventListener("click", async (e) => {

    e.preventDefault();

    clearMessage(loginMessage);

    const email = loginEmail.value.trim();

    if (!email) {
      showMessage(
        loginMessage,
        "Enter your email address first."
      );
      return;
    }

    const { error } =
      await supabaseClient.auth
        .resetPasswordForEmail(email, {
          redirectTo: RESET_URL
        });

    if (error) {
      showMessage(
        loginMessage,
        error.message
      );
      return;
    }

    showMessage(
      loginMessage,
      "Password reset email sent.",
      "success"
    );

  });


/* SESSION */

async function checkSession() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();

  if (!session) return;

  try {

    currentProfile =
      await getAdminProfile(session.user.id);

    openDashboard();

  } catch (error) {

    await supabaseClient.auth.signOut();

  }
}


/* DASHBOARD */

async function openDashboard() {

  loginPage.classList.add("hidden");
  dashboard.classList.remove("hidden");

  document.getElementById("adminName")
    .textContent =
    currentProfile?.full_name || "Administrator";

  await loadProducts();
}


/* LOGOUT */

document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    location.reload();

  });


/* LOAD PRODUCTS */

async function loadProducts() {

  productsContainer.innerHTML =
    '<div class="empty">Loading products...</div>';

  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    productsContainer.innerHTML =
      `<div class="empty">
        Unable to load products:<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }

  products = data || [];

  updateStats();
  renderProducts();
}


/* STATS */

function updateStats() {

  document.getElementById("totalProducts")
    .textContent = products.length;

  document.getElementById("availableProducts")
    .textContent =
    products.filter(
      p => p.is_available === true &&
           p.is_active === true
    ).length;

  document.getElementById("unavailableProducts")
    .textContent =
    products.filter(
      p => p.is_available !== true
    ).length;

  document.getElementById("hiddenProducts")
    .textContent =
    products.filter(
      p => p.is_active !== true
    ).length;
}


/* RENDER */

function renderProducts() {

  const query =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const filtered =
    products.filter(product => {

      const text =
        `${product.name || ""}
         ${product.category || ""}
         ${product.unit || ""}`
        .toLowerCase();

      return text.includes(query);
    });

  if (!filtered.length) {

    productsContainer.innerHTML =
      `<div class="empty">
        ${products.length
          ? "No matching products."
          : "No products yet. Click Add Product to create your first product."}
      </div>`;

    return;
  }

  productsContainer.innerHTML = `
    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>PRODUCT</th>
            <th>PRICE</th>
            <th>STOCK</th>
            <th>AVAILABILITY</th>
            <th>VISIBILITY</th>
            <th>ACTIONS</th>
          </tr>
        </thead>

        <tbody>

          ${filtered.map(product => {

            const image =
              product.image_url
                ? escapeHtml(product.image_url)
                : "logo.png";

            return `
              <tr>

                <td>
                  <div class="product-cell">

                    <img
                      class="product-image"
                      src="${image}"
                      onerror="this.src='logo.png'"
                    >

                    <div>
                      <div class="product-name">
                        ${escapeHtml(product.name)}
                      </div>

                      <div class="product-category">
                        ${escapeHtml(
                          product.category || "Uncategorized"
                        )}
                      </div>
                    </div>

                  </div>
                </td>

                <td>
                  <strong>
                    ${formatMoney(product.price)}
                  </strong>
                  / ${escapeHtml(product.unit || "")}
                </td>

                <td>
                  ${escapeHtml(product.stock ?? 0)}
                </td>

                <td>
                  ${
                    product.is_available
                    ? '<span class="badge badge-green">Available</span>'
                    : '<span class="badge badge-red">Unavailable</span>'
                  }
                </td>

                <td>
                  ${
                    product.is_active
                    ? '<span class="badge badge-green">Visible</span>'
                    : '<span class="badge badge-gray">Hidden</span>'
                  }
                </td>

                <td>

                  <div class="actions">

                    <button
                      class="btn btn-light btn-small"
                      onclick="editProduct(${product.id})"
                    >
                      Edit
                    </button>

                    <button
                      class="btn btn-danger btn-small"
                      onclick="deleteProduct(${product.id})"
                    >
                      Delete
                    </button>

                  </div>

                </td>

              </tr>
            `;

          }).join("")}

        </tbody>

      </table>

    </div>
  `;
}


document
  .getElementById("searchInput")
  .addEventListener("input", renderProducts);


/* MODAL */

document
  .getElementById("addProductBtn")
  .addEventListener("click", () => {

    productForm.reset();

    document.getElementById("productId").value = "";
    document.getElementById("existingImageUrl").value = "";

    document.getElementById("productAvailable")
      .checked = true;

    document.getElementById("productActive")
      .checked = true;

    document.getElementById("productStock")
      .value = 0;

    document.getElementById("modalTitle")
      .textContent = "Add Product";

    const preview =
      document.getElementById("imagePreview");

    preview.src = "";
    preview.style.display = "none";

    clearMessage(productMessage);

    productModal.classList.remove("hidden");
  });


function closeProductModal() {
  productModal.classList.add("hidden");
}


document
  .getElementById("closeModal")
  .addEventListener("click", closeProductModal);

document
  .getElementById("cancelProduct")
  .addEventListener("click", closeProductModal);


/* IMAGE PREVIEW */

document
  .getElementById("productImage")
  .addEventListener("change", (e) => {

    const file = e.target.files[0];

    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {

      showMessage(
        productMessage,
        "Image must be 5 MB or smaller."
      );

      e.target.value = "";
      return;
    }

    const preview =
      document.getElementById("imagePreview");

    preview.src =
      URL.createObjectURL(file);

    preview.style.display = "block";
  });


/* UPLOAD IMAGE */

async function uploadImage(file) {

  if (!file) return null;

  const extension =
    file.name.split(".").pop().toLowerCase();

  const filename =
    `products/${Date.now()}-${crypto.randomUUID()}.${extension}`;

  const { error } =
    await supabaseClient.storage
      .from(BUCKET)
      .upload(filename, file, {
        cacheControl: "3600",
        upsert: false
      });

  if (error) {
    throw new Error(
      "IMAGE UPLOAD ERROR: " + error.message
    );
  }

  const { data } =
    supabaseClient.storage
      .from(BUCKET)
      .getPublicUrl(filename);

  return data.publicUrl;
}


/* SAVE PRODUCT */

productForm.addEventListener("submit", async (e) => {

  e.preventDefault();

  clearMessage(productMessage);

  const saveButton =
    document.getElementById("saveProductBtn");

  saveButton.disabled = true;
  saveButton.textContent = "Saving...";

  try {

    const productId =
      document.getElementById("productId").value;

    const imageFile =
      document.getElementById("productImage")
        .files[0];

    let imageUrl =
      document.getElementById("existingImageUrl")
        .value || null;

    if (imageFile) {

      const uploaded =
        await uploadImage(imageFile);

      if (uploaded) {
        imageUrl = uploaded;
      }
    }

    const payload = {

      name:
        document.getElementById("productName")
          .value.trim(),

      category:
        document.getElementById("productCategory")
          .value.trim() || null,

      unit:
        document.getElementById("productUnit")
          .value,

      price:
        Number(
          document.getElementById("productPrice")
            .value
        ),

      stock:
        Number(
          document.getElementById("productStock")
            .value || 0
        ),

      description:
        document.getElementById("productDescription")
          .value.trim() || null,

      image_url: imageUrl,

      is_available:
        document.getElementById("productAvailable")
          .checked,

      is_active:
        document.getElementById("productActive")
          .checked,

      updated_at:
        new Date().toISOString()
    };


    let result;

    if (productId) {

      result =
        await supabaseClient
          .from("products")
          .update(payload)
          .eq("id", productId);

    } else {

      result =
        await supabaseClient
          .from("products")
          .insert(payload);

    }


    if (result.error) {
      throw new Error(
        "DATABASE ERROR: " +
        result.error.message
      );
    }


    showMessage(
      productMessage,
      productId
        ? "Product updated successfully."
        : "Product added successfully.",
      "success"
    );


    await loadProducts();

    setTimeout(() => {
      closeProductModal();
    }, 600);


  } catch (error) {

    showMessage(
      productMessage,
      error.message,
      "error"
    );

  } finally {

    saveButton.disabled = false;
    saveButton.textContent = "Save Product";

  }

});


/* EDIT PRODUCT */

window.editProduct = function(id) {

  const product =
    products.find(
      p => String(p.id) === String(id)
    );

  if (!product) return;

  document.getElementById("modalTitle")
    .textContent = "Edit Product";

  document.getElementById("productId")
    .value = product.id;

  document.getElementById("productName")
    .value = product.name || "";

  document.getElementById("productCategory")
    .value = product.category || "";

  document.getElementById("productUnit")
    .value = product.unit || "";

  document.getElementById("productPrice")
    .value = product.price ?? "";

  document.getElementById("productStock")
    .value = product.stock ?? 0;

  document.getElementById("productDescription")
    .value = product.description || "";

  document.getElementById("productAvailable")
    .checked = product.is_available === true;

  document.getElementById("productActive")
    .checked = product.is_active === true;

  document.getElementById("existingImageUrl")
    .value = product.image_url || "";

  document.getElementById("productImage")
    .value = "";

  const preview =
    document.getElementById("imagePreview");

  if (product.image_url) {

    preview.src = product.image_url;
    preview.style.display = "block";

  } else {

    preview.src = "";
    preview.style.display = "none";
  }

  clearMessage(productMessage);

  productModal.classList.remove("hidden");
};


/* DELETE PRODUCT */

window.deleteProduct = async function(id) {

  const product =
    products.find(
      p => String(p.id) === String(id)
    );

  if (!product) return;

  const confirmed =
    confirm(
      `Delete "${product.name}"?\n\nThis cannot be undone.`
    );

  if (!confirmed) return;

  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);

  if (error) {

    alert(
      "DELETE ERROR: " + error.message
    );

    return;
  }

  await loadProducts();
};


/* START */

checkSession();

</script>
